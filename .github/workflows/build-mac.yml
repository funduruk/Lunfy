name: Build Mac DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download JavaFX SDK
        run: |
          curl -L https://download2.gluonhq.com/openjfx/21/openjfx-21_osx-x64_bin-sdk.zip -o javafx.zip
          unzip javafx.zip -d javafx

      - name: Build JAR
        working-directory: lunfy-client
        run: ./gradlew jar

      - name: Build DMG
        run: |
          jpackage \
            --input lunfy-client/build/libs \
            --main-jar meetgrid-client-1.0-SNAPSHOT.jar \
            --main-class ru.funduruk.MainApplication \
            --name Lunfy \
            --app-version 1.0.0 \
            --type dmg \
            --java-options "--module-path $PWD/javafx/javafx-sdk-21/lib --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.base,java.net.http" \
            --dest installer

      - name: Upload DMG
        uses: actions/upload-artifact@v3
        with:
          name: Lunfy-mac
          path: installer/*.dmg